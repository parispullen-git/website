name: Build and Deploy

# Normal deploys remain manual. A push to the single .deploy-trigger file
# is also allowed so an authorized repository tool can launch the same
# production workflow without changing site source files.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.deploy-trigger'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage approved Penthouse v7 room images
        run: |
          test -f Living-room7.jpeg
          test -f closet-v7.jpeg
          cp Living-room7.jpeg assets/img/room-living.jpg
          cp Living-room7.jpeg assets/img/room-living@sm.jpg
          cp Living-room7.jpeg assets/img/room-living-v7.jpg
          cp Living-room7.jpeg assets/img/room-living-v7@sm.jpg
          cp closet-v7.jpeg assets/img/room-closet.jpg
          cp closet-v7.jpeg assets/img/room-closet@sm.jpg
          cp closet-v7.jpeg assets/img/room-closet-v7.jpg
          cp closet-v7.jpeg assets/img/room-closet-v7@sm.jpg
          sed -i -E 's/IMG_VER = "[^"]+"/IMG_VER = "20260924v7k"/' build_house.py
          sed -i -E "s/var IMG_VER = '[^']+';/var IMG_VER = '20260924v7k';/" assets/js/penthouse.js

      - name: Rebuild generated pages
        run: |
          python3 build_journal.py
          python3 scripts/patch_city_artifacts.py
          python3 scripts/patch_mockup_room_nodes.py
          python3 scripts/patch_kitchen_v7_nodes.py
          python3 scripts/patch_v7_position_corrections.py
          python3 build_house.py
          python3 build_casefiles.py
          python3 build_charlotte.py
          python3 scripts/build_wardrobe.py
          python3 scripts/patch_blueprint_mobile.py
          python3 scripts/patch_city_popup.py
          python3 scripts/update_links_hub.py
          python3 scripts/patch_cocktail_artifacts.py
          python3 scripts/patch_cocktail_menu.py

      - name: Pin v7 assets and bust Penthouse runtime cache
        run: |
          sed -i 's#assets/img/room-living@sm.jpg?v=20260924v7k#assets/img/room-living-v7@sm.jpg?v=20260924v7k#g' house.html
          sed -i 's#assets/img/room-living.jpg?v=20260924v7k#assets/img/room-living-v7.jpg?v=20260924v7k#g' house.html
          sed -i 's#assets/img/room-closet@sm.jpg?v=20260924v7k#assets/img/room-closet-v7@sm.jpg?v=20260924v7k#g' house.html
          sed -i 's#assets/img/room-closet.jpg?v=20260924v7k#assets/img/room-closet-v7.jpg?v=20260924v7k#g' house.html
          sed -i -E 's#assets/js/penthouse\.js\?v=[^" ]+#assets/js/penthouse.js?v=20260924lr7k#g' index.html

      - name: Verify Penthouse v7 desktop and mobile output
        run: python3 scripts/verify_penthouse_v7.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=parispullen --commit-dirty=true
