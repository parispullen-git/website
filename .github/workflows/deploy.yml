name: Build and Deploy

# Manual only -- triggered by the dashboard's "Deploy Live" button (via
# functions/api/deploy.js, which calls this workflow's dispatch API using
# GITHUB_TOKEN) or by a person clicking "Run workflow" on this repo's
# Actions tab. Deliberately NOT wired to push -- a commit landing on main
# (from the dashboard's Journal editor, or anything else) should never by
# itself put anything live; going live is still its own explicit step.
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The approved v7 room images are uploaded at repo root. Stage them into
      # the existing responsive room-image slots at deploy time so the current
      # room renderer, mobile srcset, hotspots and artifact wiring stay intact.
      - name: Stage approved Penthouse v7 room images
        run: |
          test -f Living-room7.jpeg
          test -f closet-v7.jpeg
          cp Living-room7.jpeg assets/img/room-living.jpg
          cp Living-room7.jpeg assets/img/room-living@sm.jpg
          cp closet-v7.jpeg assets/img/room-closet.jpg
          cp closet-v7.jpeg assets/img/room-closet@sm.jpg
          sed -i -E 's/IMG_VER = "[^"]+"/IMG_VER = "20260924v7"/' build_house.py
          sed -i -E "s/var IMG_VER = '[^']+';/var IMG_VER = '20260924v7';/" assets/js/penthouse.js

      # Regenerates every static page from its data/*.json source, so the
      # deployed site always matches whatever was last saved -- from the
      # dashboard, the local Operator Console, or a direct file edit.
      # Deliberately excludes build_drafting.py (reads uncommitted local
      # client data) and scripts/build_brands.py (copies from sibling
      # project directories that don't exist in this checkout) -- both
      # stay local-only, manual operations.
      - name: Rebuild generated pages
        run: |
          python3 build_journal.py
          python3 scripts/patch_city_artifacts.py
          python3 scripts/patch_mockup_room_nodes.py
          python3 build_house.py
          python3 build_casefiles.py
          python3 build_charlotte.py
          python3 scripts/build_wardrobe.py
          python3 scripts/patch_blueprint_mobile.py
          python3 scripts/patch_city_popup.py
          python3 scripts/update_links_hub.py
          python3 scripts/patch_cocktail_artifacts.py
          python3 scripts/patch_cocktail_menu.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=parispullen --commit-dirty=true