name: Build and Deploy

# Manual only -- triggered by the dashboard's "Deploy Live" button (via
# functions/api/deploy.js, which calls this workflow's dispatch API using
# GITHUB_TOKEN) or by a person clicking "Run workflow" on this repo's
# Actions tab. Deliberately NOT wired to push -- a commit landing on main
# (from the dashboard's Journal editor, or anything else) should never by
# itself put anything live; going live is still its own explicit step.
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The approved v7 room images are uploaded at repo root. Stage them into
      # both the legacy slots and unique v7 filenames. The unique filenames are
      # what house.html will use, so neither browser nor Cloudflare cache can
      # serve an older room image under a previously reused URL.
      - name: Stage approved Penthouse v7 room images
        run: |
          test -f Living-room7.jpeg
          test -f closet-v7.jpeg
          cp Living-room7.jpeg assets/img/room-living.jpg
          cp Living-room7.jpeg assets/img/room-living@sm.jpg
          cp Living-room7.jpeg assets/img/room-living-v7.jpg
          cp Living-room7.jpeg assets/img/room-living-v7@sm.jpg
          cp closet-v7.jpeg assets/img/room-closet.jpg
          cp closet-v7.jpeg assets/img/room-closet@sm.jpg
          cp closet-v7.jpeg assets/img/room-closet-v7.jpg
          cp closet-v7.jpeg assets/img/room-closet-v7@sm.jpg
          sed -i -E 's/IMG_VER = "[^"]+"/IMG_VER = "20260924v7b"/' build_house.py
          sed -i -E "s/var IMG_VER = '[^']+';/var IMG_VER = '20260924v7b';/" assets/js/penthouse.js

      # Regenerates every static page from its data/*.json source, so the
      # deployed site always matches whatever was last saved -- from the
      # dashboard, the local Operator Console, or a direct file edit.
      # Deliberately excludes build_drafting.py (reads uncommitted local
      # client data) and scripts/build_brands.py (copies from sibling
      # project directories that don't exist in this checkout) -- both
      # stay local-only, manual operations.
      - name: Rebuild generated pages
        run: |
          python3 build_journal.py
          python3 scripts/patch_city_artifacts.py
          python3 scripts/patch_mockup_room_nodes.py
          python3 build_house.py
          python3 build_casefiles.py
          python3 build_charlotte.py
          python3 scripts/build_wardrobe.py
          python3 scripts/patch_blueprint_mobile.py
          python3 scripts/patch_city_popup.py
          python3 scripts/update_links_hub.py
          python3 scripts/patch_cocktail_artifacts.py
          python3 scripts/patch_cocktail_menu.py

      # Force the generated Penthouse page to use never-before-used v7 asset
      # URLs for these two rooms. This bypasses all cache entries associated
      # with room-living.jpg and room-closet.jpg while preserving responsive
      # srcset behavior, hotspots, room navigation and the rest of the build.
      - name: Pin Living Room and Closet to unique v7 URLs
        run: |
          sed -i 's#assets/img/room-living@sm.jpg?v=20260924v7b#assets/img/room-living-v7@sm.jpg?v=20260924v7b#g' house.html
          sed -i 's#assets/img/room-living.jpg?v=20260924v7b#assets/img/room-living-v7.jpg?v=20260924v7b#g' house.html
          sed -i 's#assets/img/room-closet@sm.jpg?v=20260924v7b#assets/img/room-closet-v7@sm.jpg?v=20260924v7b#g' house.html
          sed -i 's#assets/img/room-closet.jpg?v=20260924v7b#assets/img/room-closet-v7.jpg?v=20260924v7b#g' house.html
          grep -q 'room-living-v7.jpg?v=20260924v7b' house.html
          grep -q 'room-closet-v7.jpg?v=20260924v7b' house.html

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=parispullen --commit-dirty=true
