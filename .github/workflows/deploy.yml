name: Build and Deploy

# Normally manual-only. This push trigger is temporary for the approved
# mobile links hub rollout and will be removed immediately after the run is created.
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The approved v5 room images are uploaded at repo root. Stage them into
      # the existing responsive room-image slots at deploy time so the current
      # room renderer, mobile srcset, hotspots and artifact wiring stay intact.
      - name: Stage approved Penthouse v5 room images
        run: |
          test -f living-room-v5.jpeg
          test -f closet-v5.jpeg
          cp living-room-v5.jpeg assets/img/room-living.jpg
          cp living-room-v5.jpeg assets/img/room-living@sm.jpg
          cp closet-v5.jpeg assets/img/room-closet.jpg
          cp closet-v5.jpeg assets/img/room-closet@sm.jpg
          sed -i -E 's/IMG_VER = "[^"]+"/IMG_VER = "20260923b"/' build_house.py
          sed -i -E "s/var IMG_VER = '[^']+';/var IMG_VER = '20260923b';/" assets/js/penthouse.js

      - name: Rebuild generated pages
        run: |
          python3 build_journal.py
          python3 scripts/patch_city_artifacts.py
          python3 scripts/patch_mockup_room_nodes.py
          python3 build_house.py
          python3 build_casefiles.py
          python3 build_charlotte.py
          python3 scripts/build_wardrobe.py
          python3 scripts/patch_blueprint_mobile.py
          python3 scripts/patch_city_popup.py
          python3 scripts/update_links_hub.py
          python3 scripts/patch_cocktail_artifacts.py
          python3 scripts/patch_cocktail_menu.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=parispullen --commit-dirty=true