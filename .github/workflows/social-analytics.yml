name: Social Analytics

# Runs once a day, independent of any code change -- pulls an Instagram +
# Threads follower snapshot via Meta's Graph API and writes it straight to
# the dashboard's KV content store (POST /api/content?collection=social-analytics),
# the same live endpoint the dashboard's own "Social Analytics" tab already
# reads and writes. No rebuild, no deploy -- see
# scripts/fetch_social_analytics.py's own header for why, and
# local-admin/SOCIAL_ANALYTICS_SETUP.md for the one-time credential setup
# this needs before it can do anything.
on:
  schedule:
    - cron: '30 12 * * *'  # 12:30 UTC daily -- offset from Daily News' 12:00 so they don't run in the same minute
  workflow_dispatch: {}  # manual "Run workflow" button, for testing this without waiting for the schedule

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and publish social analytics
        env:
          DASHBOARD_PASSPHRASE_HASH: ${{ secrets.DASHBOARD_PASSPHRASE_HASH }}
          META_IG_ACCESS_TOKEN: ${{ secrets.META_IG_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_THREADS_ACCESS_TOKEN: ${{ secrets.META_THREADS_ACCESS_TOKEN }}
          META_THREADS_USER_ID: ${{ secrets.META_THREADS_USER_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/fetch_social_analytics.py
