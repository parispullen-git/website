<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Proposal — Paris Pullen</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#0A0A0B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/world.css">
<style>
  .prop{max-width:640px;margin-inline:auto;padding-top:clamp(5rem,14vh,8rem);padding-bottom:var(--s10)}
  .prop__state{max-width:420px;margin-inline:auto;text-align:center;padding-top:clamp(8rem,22vh,14rem)}
  .prop__head{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s4);flex-wrap:wrap}
  .prop__table{border:1px solid var(--hairline);margin-top:var(--s6)}
  .prop__row{display:flex;justify-content:space-between;gap:var(--s4);padding:var(--s4) var(--s5);border-bottom:1px solid var(--hairline)}
  .prop__row:last-child{border-bottom:none}
  .prop__row .desc{color:var(--ivory)}
  .prop__row .amt{font-family:var(--font-mono);color:var(--bone);white-space:nowrap}
  .prop__total{display:flex;justify-content:space-between;gap:var(--s4);padding:var(--s5);background:#111;border-top:1px solid var(--brass)}
  .prop__total .label{font-family:var(--font-mono);font-size:var(--t-micro);letter-spacing:.14em;text-transform:uppercase;color:var(--graphite)}
  .prop__total .amt{font-family:var(--font-mono);font-size:1.2rem;color:var(--brass-lit)}
  .prop__notes{margin-top:var(--s6);color:var(--bone);font-size:.95rem;line-height:1.7;white-space:pre-wrap}
  .prop__meta{font-family:var(--font-mono);font-size:var(--t-micro);letter-spacing:.06em;color:var(--graphite);margin-top:var(--s3)}
  .prop__cta{display:flex;gap:var(--s3);flex-wrap:wrap;margin-top:var(--s7)}
  .prop__err{color:#C0555A}
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<header class="worldnav">
  <a class="worldnav__mark" href="index.html"><span class="foxx" aria-hidden="true"></span>Paris Pullen</a>
</header>

<main>
<section class="scene scene--pad" id="propLoading">
  <div class="wrap prop__state">
    <p class="eyebrow">Proposal</p>
    <p class="body" style="margin-top:var(--s3)">Loading&#8230;</p>
  </div>
</section>

<section class="scene scene--pad" id="propMissing" hidden>
  <div class="wrap prop__state">
    <p class="eyebrow">Proposal</p>
    <h1 class="display display--h2">Not Found</h1>
    <p class="body prop__err" style="margin-top:var(--s3)" id="propMissingReason">This link isn&#8217;t valid, or the proposal has been removed.</p>
    <p class="body" style="margin-top:var(--s5)">If you believe this is a mistake, reach out and we&#8217;ll send it again.</p>
    <div class="prop__cta" style="justify-content:center">
      <a class="cta" href="mailto:hello@parispullen.com"><span>Email Paris Pullen</span></a>
    </div>
  </div>
</section>

<section class="scene scene--pad" id="propContent" hidden>
  <div class="wrap prop">
    <div class="prop__head">
      <div>
        <p class="eyebrow">Proposal, Prepared For</p>
        <h1 class="display display--h2" id="prop-name">&#8212;</h1>
      </div>
      <span class="badge" id="prop-status">Draft</span>
    </div>
    <p class="prop__meta" id="prop-meta"></p>

    <div class="prop__table" id="prop-items"></div>
    <div class="prop__total">
      <span class="label">Total</span>
      <span class="amt" id="prop-total">$0.00</span>
    </div>

    <div class="prop__notes" id="prop-notes" hidden></div>

    <div class="prop__cta">
      <a class="cta" id="prop-accept" href="mailto:hello@parispullen.com"><span>Accept &amp; Get in Touch</span></a>
      <a class="cta cta--ghost" href="atelier.html"><span>Questions First</span></a>
    </div>
  </div>
</section>
</main>

<script>
(function(){
  'use strict';

  function money(v){
    var n = Number(v || 0);
    return n.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function fmtDate(ts){
    if (!ts) return '';
    try { return new Date(ts).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}); }
    catch(e){ return ''; }
  }

  var loadingEl = document.getElementById('propLoading');
  var missingEl = document.getElementById('propMissing');
  var contentEl = document.getElementById('propContent');

  function show(el){
    [loadingEl, missingEl, contentEl].forEach(function(e){ e.hidden = (e !== el); });
  }

  var id = new URLSearchParams(window.location.search).get('id');
  if (!id) {
    document.getElementById('propMissingReason').textContent = 'No proposal was specified in this link.';
    show(missingEl);
    return;
  }

  fetch('/.netlify/functions/proposals?id=' + encodeURIComponent(id))
    .then(function(r){
      if (!r.ok) throw new Error('not found');
      return r.json();
    })
    .then(function(p){
      var expired = p.expiresAt && Date.now() > p.expiresAt;
      if (expired) {
        document.getElementById('propMissingReason').textContent = 'This proposal expired on ' + fmtDate(p.expiresAt) + '.';
        show(missingEl);
        return;
      }

      document.getElementById('prop-name').textContent = p.name || 'Your Proposal';
      document.title = 'Proposal for ' + (p.name || 'You') + ' — Paris Pullen';

      var statusEl = document.getElementById('prop-status');
      var STATUS_LABEL = { draft: 'Draft', sent: 'Sent', accepted: 'Accepted', declined: 'Declined' };
      statusEl.textContent = STATUS_LABEL[p.status] || 'Sent';
      if (p.status === 'accepted') statusEl.className = 'badge badge--brass';

      var metaBits = [];
      if (p.createdAt) metaBits.push('Prepared ' + fmtDate(p.createdAt));
      if (p.expiresAt) metaBits.push('Valid through ' + fmtDate(p.expiresAt));
      document.getElementById('prop-meta').textContent = metaBits.join(' · ');

      var items = p.items || [];
      document.getElementById('prop-items').innerHTML = items.map(function(it){
        return '<div class="prop__row"><span class="desc">' + esc(it.description) + '</span>' +
          '<span class="amt">$' + money(it.amount) + '</span></div>';
      }).join('') || '<div class="prop__row"><span class="desc">No line items.</span></div>';

      document.getElementById('prop-total').textContent = '$' + money(p.total || 0);

      if (p.notes) {
        var notesEl = document.getElementById('prop-notes');
        notesEl.textContent = p.notes;
        notesEl.hidden = false;
      }

      var subject = encodeURIComponent('Accepting the proposal — ' + (p.name || ''));
      var body = encodeURIComponent('Hi Paris,\n\nI’d like to move forward with this proposal (' + (p.name || '') + ', $' + money(p.total || 0) + ').\n\n');
      document.getElementById('prop-accept').href = 'mailto:hello@parispullen.com?subject=' + subject + '&body=' + body;

      show(contentEl);
    })
    .catch(function(){
      document.getElementById('propMissingReason').textContent = 'This link isn’t valid, or the proposal has been removed.';
      show(missingEl);
    });
})();
</script>
</body>
</html>
