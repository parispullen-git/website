<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><link rel="icon" href="/assets/img/pp-monogram-favicon.png?v=20260928c" type="image/png" sizes="any"><link rel="apple-touch-icon" href="/assets/img/pp-monogram-favicon.png?v=20260928c">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Wardrobe Arcade — Paris Pullen</title><meta property="og:image" content="https://parispullen.com/assets/img/pp-seo.png?v=20260928c"><meta property="og:image:width" content="1366"><meta property="og:image:height" content="768"><meta property="og:image:type" content="image/png"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://parispullen.com/assets/img/pp-seo.png?v=20260928c">
<style>
  html,body{width:100%;height:100%;margin:0;background:#0a0a0b;overflow:hidden}
  #arcade{display:block;width:100%;height:100%;border:0;opacity:0;transition:opacity .14s ease;background:#0a0a0b}
  #arcade.is-ready{opacity:1}
</style>
</head>
<body>
<iframe id="arcade" title="The Wardrobe Arcade" src="/blueprint.html?embed=1"></iframe>
<script>
(() => {
  const frame = document.getElementById('arcade');
  let attempts = 0;
  function configureGame() {
    try {
      const doc = frame.contentDocument;
      const popup = doc && doc.getElementById('popup');
      const room = doc && doc.querySelector('.room');
      const returnButton = doc && doc.getElementById('return');
      const guideButton = doc && doc.getElementById('parentGuide');
      if (!popup || !guideButton) throw new Error('Game not ready');
      if (room) room.remove();
      doc.body.style.background = '#0a0a0b';
      const brand = doc.querySelector('.portal-brand');
      const byline = doc.querySelector('.portal-byline');
      if (brand && brand.firstChild) brand.firstChild.nodeValue = 'THE WARDROBE ';
      if (byline) byline.textContent = 'by Paris Pullen';
      if (returnButton) returnButton.remove();
      guideButton.onclick = () => window.location.assign('/style-artifacts.html?embed=1&view=blueprints');
      if (!popup.open) {
        try { popup.showModal(); }
        catch (_) { popup.setAttribute('open', ''); }
      }
      requestAnimationFrame(() => frame.classList.add('is-ready'));
    } catch (error) {
      if (++attempts < 80) setTimeout(configureGame, 50);
    }
  }
  frame.addEventListener('load', () => setTimeout(configureGame, 20));
  configureGame();
})();
</script>
</body>
</html>
