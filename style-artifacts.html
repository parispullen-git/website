<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>The Style — Paris Pullen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#c8a15b;--paper:#f5efe4;--ink:#08090a}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ink);color:var(--paper);font-family:Inter,Arial,sans-serif}.style{position:relative;isolation:isolate;display:grid;place-items:center;min-height:100svh;overflow:hidden;background:#17120f}.style::before{content:"";position:absolute;z-index:-2;inset:0;background:url('/assets/img/room-closet-v7.jpg') center/cover no-repeat;transform:scale(1.01)}.style::after{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(90deg,rgba(5,4,3,.70),rgba(5,4,3,.46) 50%,rgba(5,4,3,.70)),linear-gradient(0deg,rgba(5,4,3,.76),rgba(5,4,3,.42))}.menu{width:min(320px,calc(100vw - 48px));display:grid;gap:12px;align-content:center;justify-items:stretch}.choice{width:100%;min-height:46px;border:1px solid rgba(205,164,83,.8);background:rgba(9,8,7,.62);box-shadow:0 9px 24px rgba(0,0,0,.2),inset 0 0 0 1px rgba(255,255,255,.04);color:var(--paper);font:600 12px/1 'Playfair Display',serif;letter-spacing:.02em;text-transform:uppercase;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}.choice:hover,.choice:focus-visible{background:rgba(28,22,15,.83);border-color:#f0ca7b;outline:0;transform:translateY(-2px)}.choice small{display:block;margin-top:5px;color:#d7ba7c;font:500 7px/1.2 Inter,sans-serif;letter-spacing:.17em;text-transform:uppercase}.choice[disabled]{border-color:rgba(205,164,83,.35);color:rgba(245,239,228,.58);cursor:not-allowed}.choice[disabled]:hover{background:rgba(9,8,7,.62);border-color:rgba(205,164,83,.35);transform:none}.book-list{display:none}.book-list.is-open{display:grid}.primary.is-hidden{display:none}.book-list .choice{min-height:45px;text-align:left;padding:0 16px}.book-list .choice strong{display:block;font:600 11px/1.1 'Playfair Display',serif}.book-list .choice small{margin-top:4px}.back{margin-top:4px;border:0;background:transparent;color:#e4c781;font:500 8px/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}.monogram{position:absolute;bottom:clamp(18px,4vh,42px);left:50%;transform:translateX(-50%);display:grid;justify-items:center;gap:7px;color:#d4aa5a;font:500 8px/1 Inter,sans-serif;letter-spacing:.22em;text-transform:uppercase}.monogram img{width:31px;height:31px;object-fit:contain;filter:sepia(.7) saturate(.8) brightness(1.15)}@media(max-width:640px){.style::before{background-position:center top}.style::after{background:linear-gradient(0deg,rgba(5,4,3,.65),transparent 45%,rgba(5,4,3,.14))}.menu{width:min(320px,calc(100vw - 40px));gap:12px}.choice{min-height:42px;font-size:11px}.monogram{bottom:16px;font-size:7px}}
</style>
</head>
<body><main class="style"><section class="menu" aria-label="The Style artifacts"><div class="primary" id="primary"><button class="choice" id="blueprints" type="button">The Blueprints</button><button class="choice" id="wardrobe" type="button">The Wardrobe Arcade</button><button class="choice" type="button" disabled>The Compliment Test<small>Coming soon</small></button></div><div class="book-list" id="books" aria-live="polite"><button class="choice" type="button" id="book001"><strong>Blueprint 001 — The Navy Suit</strong><small>Available now</small></button><button class="choice" type="button" disabled><strong>Blueprint 002 — The Grey Suit</strong><small>Releasing in the coming weeks</small></button><button class="choice" type="button" disabled><strong>Blueprint 003 — The Tan Suit</strong><small>Releasing in the coming weeks</small></button><button class="choice" type="button" disabled><strong>Blueprint 004 — The Brown Suit</strong><small>Releasing in the coming weeks</small></button><button class="choice" type="button" disabled><strong>Blueprint 005 — The Black Suit</strong><small>Releasing in the coming weeks</small></button><button class="back" id="back" type="button">← The Style</button></div></section><div class="monogram"><img src="/assets/img/monogram-mark.svg" alt=""><span>parispullen.com</span></div></main><script>const primary=document.getElementById('primary'),books=document.getElementById('books');document.getElementById('blueprints').onclick=()=>{primary.classList.add('is-hidden');books.classList.add('is-open')};document.getElementById('back').onclick=()=>{books.classList.remove('is-open');primary.classList.remove('is-hidden')};document.getElementById('book001').onclick=()=>location.assign('/blueprint-book-001.html?embed=1');document.getElementById('wardrobe').onclick=()=>location.assign('/blueprint.html?embed=1');</script></body></html>
