<style>
:root{--paper:#efe6d5;--ink:#171310;--muted:#6f6254;--brass:#a88345;--display:"Playfair Display",Georgia,serif;--sans:"Inter",Arial,sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0c0b09;color:var(--ink);font-family:var(--sans)}body{overflow:hidden}button{font:inherit}.book{height:100dvh;background:var(--paper);position:relative;overflow:hidden;box-shadow:0 0 100px rgba(0,0,0,.45) inset}.book:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.2;background-image:radial-gradient(rgba(78,60,36,.14) .65px,transparent .65px);background-size:4px 4px}.chrome{height:64px;position:relative;z-index:2;display:flex;align-items:center;border-bottom:1px solid rgba(23,19,16,.2);padding:0 18px;background:rgba(239,230,213,.92)}.brand small{display:block;font-size:7px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}.brand strong{display:block;font:400 clamp(14px,2.1vw,20px)/1.1 var(--display);letter-spacing:.01em;overflow-wrap:anywhere}.pages{height:calc(100dvh - 64px);position:relative;overflow:hidden}.index,.recipe{position:absolute;inset:0;overflow:auto;transition:transform .42s cubic-bezier(.22,.8,.23,1),opacity .3s}.index{padding:clamp(20px,3.8vw,46px)}.index.is-away{transform:translateX(-8%);opacity:0;pointer-events:none}.recipe{transform:translateX(102%);opacity:0;background:var(--paper)}.recipe.is-open{transform:none;opacity:1}.mast{max-width:1280px;margin:0 auto 26px;text-align:center;border:1px solid rgba(23,19,16,.28);padding:24px 18px 26px;position:relative}.mast:before,.mast:after{content:"";position:absolute;top:22px;width:28%;height:1px;background:rgba(23,19,16,.38)}.mast:before{left:0}.mast:after{right:0}.monogram{height:42px;display:grid;place-items:center}.monogram img{height:42px;max-width:76px;object-fit:contain}.mast .kicker{margin:8px 0 0;font-size:8px;letter-spacing:.36em;text-transform:uppercase}.mast h1{font:400 clamp(40px,7vw,82px)/.94 var(--display);margin:28px 0 8px}.mast p{margin:0;font:400 clamp(12px,1.2vw,17px) var(--display);color:var(--muted);letter-spacing:.04em}.menu-title{max-width:1280px;margin:0 auto 13px;display:flex;align-items:center;gap:14px;font-size:8px;text-transform:uppercase;letter-spacing:.3em;color:var(--muted)}.menu-title:before,.menu-title:after{content:"";height:1px;flex:1;background:rgba(23,19,16,.28)}.grid{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding-bottom:32px}.card{position:relative;aspect-ratio:2/3;border:1px solid rgba(23,19,16,.25);background:#e7dcc8;overflow:hidden;padding:0;cursor:pointer}.card img{width:100%;height:100%;display:block;object-fit:contain;transition:transform .55s ease}.card:hover img,.card:focus-visible img{transform:scale(1.025)}.card:focus-visible{outline:2px solid var(--brass);outline-offset:2px}.recipe-inner{min-height:100%;display:grid;grid-template-columns:minmax(320px,.86fr) 1.14fr}.poster{background:#d5c8b5;display:grid;place-items:center;padding:18px;border-right:1px solid rgba(23,19,16,.25)}.poster img{display:block;max-width:100%;max-height:calc(100dvh - 100px);object-fit:contain;box-shadow:0 18px 50px rgba(53,39,22,.22)}.detail{padding:clamp(24px,4vw,56px);align-self:center}.back{border:0;background:transparent;padding:0;margin-bottom:18px;text-transform:uppercase;letter-spacing:.18em;font-size:8px;color:var(--muted);cursor:pointer}.back span{font-size:16px;margin-right:8px}.recipe-nav{display:flex;justify-content:space-between;gap:10px;margin:0 0 20px}.recipe-nav button{border:1px solid rgba(23,19,16,.3);background:transparent;padding:8px 10px;color:var(--ink);font-size:8px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}.recipe-nav button:hover:not(:disabled){background:var(--ink);color:var(--paper)}.recipe-nav button:disabled{opacity:.35;cursor:default}.eyebrow{font-size:8px;letter-spacing:.24em;text-transform:uppercase;color:var(--brass)}.detail h2{font:400 clamp(42px,6vw,76px)/.95 var(--display);margin:8px 0 18px}.detail p{max-width:38ch;font-size:14px;line-height:1.65;color:var(--muted)}.meta{border-top:1px solid rgba(23,19,16,.25);border-bottom:1px solid rgba(23,19,16,.25);padding:12px 0;margin:24px 0;font:400 18px var(--display)}.recipe-link{display:inline-block;border:1px solid rgba(23,19,16,.35);padding:12px 15px;color:var(--ink);text-decoration:none;font-size:9px;letter-spacing:.18em;text-transform:uppercase}.recipe-link:hover{background:var(--ink);color:var(--paper)}.footline{margin-top:28px;padding-top:14px;border-top:1px solid rgba(23,19,16,.22);font-size:7px;text-transform:uppercase;letter-spacing:.28em;color:var(--muted);text-align:center}@media(max-width:900px){.chrome{height:58px;padding:0 12px}.pages{height:calc(100dvh - 58px)}.grid{grid-template-columns:repeat(2,1fr);gap:8px}.recipe{overflow:auto;overscroll-behavior:contain}.recipe-inner{min-height:100%;grid-template-columns:1fr;display:block}.poster{height:auto;min-height:42svh;padding:10px;border-right:0;border-bottom:1px solid rgba(23,19,16,.2)}.poster img{max-height:100%}.detail{min-height:0;overflow:visible;padding:22px 18px 36px}.detail>*{min-width:0}.detail h2{font-size:clamp(30px,8.2vw,40px);line-height:1.08;margin-bottom:14px}.detail p{overflow-wrap:anywhere}}@media(max-width:520px){.index{padding:12px 10px 24px}.chrome{padding:0 10px}.brand small{font-size:6px;letter-spacing:.16em}.brand strong{font-size:clamp(12px,3.8vw,16px)}.mast{padding:18px 12px 19px;margin-bottom:13px}.mast:before,.mast:after{width:20%}.mast h1{font-size:38px;margin-top:20px}.mast p{font-size:11px}.grid{gap:7px}.poster{height:auto;min-height:36svh}.detail{min-height:0;padding:16px 14px 30px}.detail h2{font-size:clamp(28px,8.6vw,36px);line-height:1.1;overflow-wrap:anywhere}.detail p{font-size:13px}.recipe-nav{margin-bottom:16px}.recipe-nav button{font-size:7px;padding:8px}}@media(prefers-reduced-motion:reduce){.index,.recipe,.card img{transition:none!important}}

<body><main class="book"><header class="chrome"><div class="brand"><small>Paris Pullen · The Compliment Hotel</small><strong>The Gentleman’s Cookbook</strong></div></header><div class="pages"><section class="index" id="index"><div class="mast"><div class="monogram"><img src="/assets/img/monogram-mark.svg" alt="Paris Pullen"></div><div class="kicker">HelloFresh × Paris Pullen</div><h1>The Gentleman’s<br>Kitchen Menu</h1><p>Six recipes. Properly made. Better shared.</p></div><div class="menu-title"><span>The House Edit · 01—06</span></div><div class="grid" id="grid"></div></section><section class="recipe" id="recipe" aria-live="polite"><div class="recipe-inner"><div class="poster"><img id="rImg" alt=""></div><div class="detail"><button class="back" id="back"><span>←</span>Back to menu</button><div class="recipe-nav" aria-label="Browse recipes"><button type="button" id="prevRecipe">← Previous</button><button type="button" id="nextRecipe">Next →</button></div><div class="eyebrow" id="rNum"></div><h2 id="rName"></h2><p id="rSub"></p><div class="meta" id="rMeta"></div><p id="rStory"></p><a class="recipe-link" id="rLink" target="_blank" rel="noopener">Get this recipe ↗</a><div class="footline">A higher standard. Always.</div></div></div></section></div></main><script>const RECIPES=[{"number":"01","name":"Pork Sausage & Cheesy Eggplant Tomato Flatbreads","subtitle":"with Balsamic Glaze & Parsley","meta":"940 kcal · 45 min · Medium","story":"Brassy, crisp-edged flatbreads for a proper night in.","img":"/assets/img/hellofresh/pork-sausage-flatbreads.jpeg","link":"https://www.hellofresh.com/recipes/pork-sausage-and-cheesy-eggplant-tomato-flatbreads-68ed06f14a4d7386a892ac95"},{"number":"02","name":"Bacon, Egg, and Cheese on Brioche","subtitle":"with Chipotle Ketchup & Green Salad","meta":"590 kcal · 20 min · Easy","story":"A sharp morning classic with enough bite to wake up the room.","img":"/assets/img/hellofresh/bacon-egg-brioche.jpeg","link":"https://www.hellofresh.com/recipes/bacon-egg-and-cheese-on-brioche"},{"number":"03","name":"Chimichurri Lamb & Hot Honey Brussels Sprouts","subtitle":"with a bright herb finish","meta":"670 kcal · 35 min · Medium","story":"The showstopper: seared lamb, chimichurri, and a little heat.","img":"/assets/img/hellofresh/chimichurri-lamb.jpeg","link":"https://www.hellofresh.com/recipes/chimichurri-lamb-and-hot-honey-brussels-sprouts-69f21d783ace2ca2f08f08ba"},{"number":"04","name":"Turkey & Mushroom Shepherd’s Pie","subtitle":"topped with White Cheddar Mashed Potatoes","meta":"890 kcal · 50 min · Hard","story":"Comfort food, properly finished under a golden cheddar crust.","img":"/assets/img/hellofresh/turkey-mushroom-pie.jpeg","link":"https://www.hellofresh.com/recipes/turkey-mushroom-shepherd-s-pie-649c8b124387a88e63f51410"},{"number":"05","name":"BBQ Chicken Quesadillas","subtitle":"with Pico de Gallo & Jalapeño Crema","meta":"580 kcal · 15 min · Easy","story":"Crisp tortillas, smoky chicken, and the right amount of heat.","img":"/assets/img/hellofresh/bbq-chicken-quesadillas.jpeg","link":"https://www.hellofresh.com/recipes/bbq-chicken-quesadillas-8ba8a8b0-aa02dbf1"},{"number":"06","name":"Southwest Shrimp Tacos","subtitle":"with Pico de Gallo & Lime Crema","meta":"650 kcal · 30 min · Easy","story":"Bright, fast, and made for a table that stays up late.","img":"/assets/img/hellofresh/southwest-shrimp-tacos.jpeg","link":"https://www.hellofresh.com/recipes/southwest-shrimp-tacos-61a789cad3877c660a03a872"}];const grid=document.getElementById('grid'),index=document.getElementById('index'),recipe=document.getElementById('recipe');const rImg=document.getElementById('rImg'),rNum=document.getElementById('rNum'),rName=document.getElementById('rName'),rSub=document.getElementById('rSub'),rMeta=document.getElementById('rMeta'),rStory=document.getElementById('rStory'),rLink=document.getElementById('rLink');let currentRecipe=0;function openRecipe(r,i){currentRecipe=i;rImg.src=r.img;rImg.alt=r.name;rNum.textContent='House Recipe '+r.number;rName.textContent=r.name;rSub.textContent=r.subtitle;rMeta.textContent=r.meta;rStory.textContent=r.story;rLink.href=r.link;document.getElementById('prevRecipe').disabled=i===0;document.getElementById('nextRecipe').disabled=i===RECIPES.length-1;index.classList.add('is-away');recipe.classList.add('is-open');recipe.scrollTop=0}RECIPES.forEach(r=>{const b=document.createElement('button');b.className='card';b.type='button';b.setAttribute('aria-label',r.name);const img=document.createElement('img');img.src=r.img;img.alt='';b.appendChild(img);b.addEventListener('click',()=>openRecipe(r,RECIPES.indexOf(r)));grid.appendChild(b)});function back(){recipe.classList.remove('is-open');index.classList.remove('is-away')}document.getElementById('back').addEventListener('click',back);document.getElementById('prevRecipe').addEventListener('click',()=>openRecipe(RECIPES[Math.max(0,currentRecipe-1)],Math.max(0,currentRecipe-1)));document.getElementById('nextRecipe').addEventListener('click',()=>openRecipe(RECIPES[Math.min(RECIPES.length-1,currentRecipe+1)],Math.min(RECIPES.length-1,currentRecipe+1)));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&recipe.classList.contains('is-open'))back()});</script></body></html>
