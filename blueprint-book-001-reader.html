<html lang="en"><head><meta charset="utf-8"><link rel="icon" href="/assets/img/pp-monogram-favicon.png?v=20260928c" type="image/png" sizes="any"><link rel="apple-touch-icon" href="/assets/img/pp-monogram-favicon.png?v=20260928c"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Blueprint Book 001 — The Navy Suit</title><meta property="og:image" content="https://parispullen.com/assets/img/pp-seo.png?v=20260928c"><meta property="og:image:width" content="1366"><meta property="og:image:height" content="768"><meta property="og:image:type" content="image/png"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://parispullen.com/assets/img/pp-seo.png?v=20260928c"><style>html,body{height:100%;margin:0;background:#08111c;color:#f2eee5;font-family:Arial,sans-serif}main{min-height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box}section{text-align:center;max-width:620px}h1{font:400 clamp(32px,7vw,64px)/1.06 Georgia,serif;margin:12px 0}p{color:#cfc5b1;line-height:1.6}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}a{color:#d6ad55}</style></head><body><main id="loading"><section><p>PARIS PULLEN · THE STYLE</p><h1>Preparing Book 001</h1><p>Loading The Navy Suit.</p></section></main><iframe id="book" title="The Blueprint Book 001 — The Navy Suit"></iframe><script>(async()=>{const count=53,paths=Array.from({length:count},(_,i)=>'/assets/pdf/book-001/chunk-'+String(i).padStart(3,'0')+'.b64');try{const texts=await Promise.all(paths.map(p=>fetch(p,{cache:'force-cache'}).then(r=>{if(!r.ok)throw Error('Book unavailable');return r.text()})));const parts=texts.map(t=>{const s=atob(t.trim()),b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b});const url=URL.createObjectURL(new Blob(parts,{type:'application/pdf'}));const frame=document.getElementById('book');frame.src=url;frame.style.display='block';document.getElementBy
