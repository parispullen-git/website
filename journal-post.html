<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>The Journal — Paris Pullen</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#0A0A0B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/world.css">
<style>
  .jp__state{max-width:420px;margin-inline:auto;text-align:center;padding-top:clamp(8rem,22vh,14rem)}
  .jp{max-width:var(--measure);margin-inline:auto;padding-top:clamp(8rem,20vh,14rem);padding-bottom:var(--s10)}
  .jp-byline{display:flex;flex-wrap:wrap;gap:.55em;align-items:baseline}
  .jp-byline b{color:var(--bone);font-weight:400}
  .jp-hero{position:relative;overflow:hidden;border-radius:2px;margin-top:var(--s7);background:var(--charcoal)}
  .jp-hero img{width:100%;height:clamp(260px,42vw,480px);object-fit:cover;display:block;filter:brightness(.82)}
  .jp-body{margin-top:var(--s8);display:grid;gap:var(--s5)}
  .jp-body .pullquote{margin:var(--s3) 0}
  .jread-media{margin-top:var(--s2);max-width:var(--measure)}
  .jread-media img{width:100%;height:auto;display:block;border-radius:2px;background:var(--charcoal)}
  .jread-caption{margin:.6em 0 0;font-family:var(--font-mono);font-size:var(--t-micro);
    letter-spacing:.03em;color:var(--graphite);line-height:1.4}
  .jread-video{margin-top:var(--s2);max-width:var(--measure)}
  .jread-video__frame{position:relative;aspect-ratio:16/9;background:#000;border-radius:2px;
    overflow:hidden;container-type:size}
  .jread-video__frame iframe{position:absolute;inset:0;width:100cqw;height:100cqh;border:0}
  .jp-nav{margin-top:var(--s10);border-top:1px solid var(--rule);padding-top:var(--s7)}
  .jp-nav a{color:var(--bone)}
  .jp__err{color:#C0555A}
  .jp-draftbar{position:sticky;top:0;z-index:20;background:#4A3414;border-bottom:1px solid var(--brass);
    color:var(--champagne);font-family:var(--font-mono);font-size:var(--t-micro);letter-spacing:.1em;
    text-transform:uppercase;text-align:center;padding:.7em 1em}
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<header class="worldnav">
  <a class="worldnav__mark" href="index.html"><span class="foxx" aria-hidden="true"></span>Paris Pullen</a>
</header>

<p class="jp-draftbar" id="jpDraftbar" hidden>Draft Preview — not visible on the live Journal</p>
<main>
<section class="scene scene--pad" id="jpLoading">
  <div class="wrap jp__state">
    <p class="eyebrow">The Journal</p>
    <p class="body" style="margin-top:var(--s3)">Loading&#8230;</p>
  </div>
</section>

<section class="scene scene--pad" id="jpMissing" hidden>
  <div class="wrap jp__state">
    <p class="eyebrow">The Journal</p>
    <h1 class="display display--h2">Not Found</h1>
    <p class="body jp__err" style="margin-top:var(--s3)">This entry isn&#8217;t there, or it&#8217;s been taken down.</p>
    <div style="margin-top:var(--s6)">
      <a class="cta" href="journal.html"><span>Back to the Journal</span></a>
    </div>
  </div>
</section>

<section class="scene scene--pad" id="jpContent" hidden>
  <div class="wrap jp">
    <header class="stack stack--tight reveal">
      <p class="eyebrow jp-byline">By <b>Paris Pullen</b> &#183; <span id="jp-cat"></span> &#183; <span id="jp-read"></span></p>
      <h1 class="display display--h1" id="jp-title">&#8212;</h1>
      <p class="lede" id="jp-stand"></p>
    </header>

    <div class="jp-hero" id="jp-hero" hidden><img id="jp-hero-img" src="" alt=""></div>

    <div class="jp-body" id="jp-body"></div>

    <nav class="jp-nav reveal">
      <a class="link-under" href="journal.html">&#8592; Back to the Journal</a>
    </nav>
  </div>
</section>
</main>
</body>
<script>
(function(){
  'use strict';

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  var loadingEl = document.getElementById('jpLoading');
  var missingEl = document.getElementById('jpMissing');
  var contentEl = document.getElementById('jpContent');

  function show(el){
    [loadingEl, missingEl, contentEl].forEach(function(e){ e.hidden = (e !== el); });
  }

  var qs = new URLSearchParams(window.location.search);
  var slug = qs.get('slug');
  var preview = qs.get('preview') === '1';
  if (!slug) { show(missingEl); return; }

  fetch('/api/content?collection=journal')
    .then(function(r){ return r.json(); })
    .then(function(data){
      var posts = (data && data.records) || [];
      var p = posts.filter(function(x){ return x && x.slug === slug && (x.status !== 'draft' || preview); })[0];
      if (!p) throw new Error('not found');

      // ?preview=1 is how the dashboard's own Preview button reaches a
      // draft before it's published -- never linked from anywhere public,
      // so this banner is the only tell that it isn't the live page.
      if (preview && p.status === 'draft') document.getElementById('jpDraftbar').hidden = false;

      document.title = (p.title || 'The Journal') + ' — Paris Pullen';
      document.getElementById('jp-cat').textContent = p.catlabel || p.cat || '';
      document.getElementById('jp-read').textContent = p.read || '';
      document.getElementById('jp-title').textContent = p.title || '';
      document.getElementById('jp-stand').textContent = p.stand || '';

      var heroUrl = p.hero && p.hero.url;
      if (heroUrl) {
        document.getElementById('jp-hero-img').src = heroUrl;
        document.getElementById('jp-hero-img').alt = (p.hero && p.hero.alt) || '';
        document.getElementById('jp-hero').hidden = false;
      }

      // Body is an array of plain paragraph strings, or a string carrying
      // one of a few shorthand prefixes for richer blocks -- PQ:: (a
      // pull-quote), IMG::url|alt|caption (a full-width image, alt and
      // caption both optional), VIDEO::id (a responsive YouTube embed, the
      // dashboard already resolves a pasted watch/youtu.be link down to
      // just the ID before this is ever saved). Mirrors, in miniature, the
      // richer block set build_journal.py's static articles support.
      var body = p.body || [];
      document.getElementById('jp-body').innerHTML = body.map(function(para){
        if (typeof para !== 'string' || !para) return '';
        if (para.indexOf('PQ::') === 0) {
          return '<p class="pullquote">' + esc(para.slice(4)) + '</p>';
        }
        if (para.indexOf('IMG::') === 0) {
          var parts = para.slice(5).split('|');
          var url = (parts[0] || '').trim(), alt = (parts[1] || '').trim(), cap = (parts[2] || '').trim();
          if (!url) return '';
          return '<figure class="jread-media"><img src="' + esc(url) + '" alt="' + esc(alt) + '" loading="lazy">' +
            (cap ? '<figcaption class="jread-caption">' + esc(cap) + '</figcaption>' : '') + '</figure>';
        }
        if (para.indexOf('VIDEO::') === 0) {
          var id = para.slice(7).trim();
          if (!id) return '';
          return '<div class="jread-video"><div class="jread-video__frame"><iframe src="https://www.youtube.com/embed/' + esc(id) + '" ' +
            'title="" allow="autoplay; encrypted-media; picture-in-picture" loading="lazy" allowfullscreen></iframe></div></div>';
        }
        return '<p class="body">' + esc(para) + '</p>';
      }).join('') || '<p class="body">Nothing here yet.</p>';

      show(contentEl);
    })
    .catch(function(){
      show(missingEl);
    });
})();
</script>
</html>
