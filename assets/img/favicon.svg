<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Paris Pullen</title>
  <defs>
    <clipPath id="frame"><rect width="64" height="64" rx="12"/></clipPath>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".04"/>
      <stop offset="1" stop-color="#000" stop-opacity=".36"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#frame)">
    <image href="/assets/img/hero-boardroom.jpg" width="64" height="64" preserveAspectRatio="xMidYMid slice"/>
    <rect width="64" height="64" fill="url(#shade)"/>
  </g>
</svg>
