<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Paris Pullen — Start Here</title>
<meta name="description" content="Choose your way into the world of Paris Pullen: The Compliment Hotel, guides, the Journal, and the Network.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05080c">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@0,400;0,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/entry-screen.css?v=5">
</head>
<body>
<main class="entry-screen entry-screen--main" data-entry-screen aria-label="Paris Pullen start here">
  <div class="entry-screen__bg" aria-hidden="true"></div>
  <div class="entry-screen__inner" data-entry-main>
    <h1 class="entry-title">Choose your way in.</h1>
    <p class="entry-copy">The world is built around how you show up. Start with the room, the guide, or the network.</p>
    <nav class="entry-actions" aria-label="Start here options">
      <button class="entry-action" type="button" data-entry-open="network" style="--entry-image:url('/assets/img/env-network@sm.jpg')"><span class="entry-action__title">The Network</span><span class="entry-action__sub">Get connected with Paris</span></button>
      <a class="entry-action" href="https://parispullen.com/#penthouse" style="--entry-image:url('/assets/img/room-living@sm.jpg')"><span class="entry-action__title">Enter the Penthouse</span><span class="entry-action__sub">Begin in the Living Room</span></a>
      <button class="entry-action" type="button" data-entry-open-guides style="--entry-image:url('/assets/img/room-closet@sm.jpg')"><span class="entry-action__title">Gentlemen Guides</span><span class="entry-action__sub">Style · City · Cocktails · Kitchen</span></button>
      <a class="entry-action" href="https://parispullen.com/journal.html" style="--entry-image:url('/assets/img/room-study@sm.jpg')"><span class="entry-action__title">The Journal</span><span class="entry-action__sub">From the word of the Gentleman</span></a>
      <button class="entry-action" type="button" disabled aria-disabled="true" style="--entry-image:url('/assets/img/citymap-plate@sm.jpg')"><span class="entry-action__title">Key to the City</span><span class="entry-action__sub">Restricted · Coming soon</span></button>
    </nav>
    <div class="entry-brand entry-brand--bottom"><img class="entry-brand__mark" src="/assets/img/monogram-mark.svg" alt=""><p class="entry-brand__name">Paris Pullen</p></div>
  </div>
  <dialog class="entry-guides-modal" data-entry-guides aria-label="Select a guide"><div class="entry-screen entry-screen--guides"><div class="entry-screen__bg" aria-hidden="true"></div><div class="entry-screen__inner">
    <button class="entry-action entry-action--back" type="button" data-entry-back>← Return</button>
    <h2 class="entry-title">Select a guide.</h2>
    <div class="entry-guide-grid" aria-label="Gentlemen guides">
      <button class="entry-guide" style="--guide-image:url('/assets/img/entry/style-hero.webp')" data-entry-open="guide" data-entry-title="The Gentleman’s Guide to Suits" data-entry-src="https://parispullen.com/blueprint.html?embed=1"><span>Style<small>Suit combinations · fit · the Blueprint</small></span></button>
      <button class="entry-guide" style="--guide-image:url('/assets/img/entry/guide-map.webp')" data-entry-open="guide" data-entry-title="The Gentleman’s Guide to Charlotte" data-entry-src="https://parispullen.com/city-guide-popup.html"><span>City<small>Charlotte · the rooms worth knowing</small></span></button>
      <button class="entry-guide" style="--guide-image:url('/assets/img/room-living@sm.jpg')" data-entry-open="guide" data-entry-title="The Gentleman’s Guide to Cocktails" data-entry-src="https://parispullen.com/cocktail-menu.html?v=2cf9656&embed=1"><span>Cocktails<small>Eleven classics · properly made</small></span></button>
      <button class="entry-guide" style="--guide-image:url('/assets/img/room-kitchen.jpg')" data-entry-open="guide" data-entry-title="The Gentleman’s Guide to HelloFresh" data-entry-src="https://parispullen.com/pantry.html"><span>HelloFresh<small>The kitchen edit</small></span></button>
    </div>
  </div></div></dialog>
</main>
<script src="/assets/js/entry-screen.js?v=5" defer></script>

</html>
