<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a09">
<title>Charlotte City Explorer — The Compliment Hotel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#090a09;--panel:#101110;--panel2:#151614;--cream:#f1eadf;--muted:#9d978e;--gold:#c9a66a;--line:rgba(241,234,223,.15);--green:#18392c;--display:"Playfair Display",Georgia,serif;--sans:"Inter",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--ink);color:var(--cream);font-family:var(--sans);overflow:hidden}button,a{font:inherit;color:inherit}button{cursor:pointer}.app{height:100dvh;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(350px,.68fr);background:#090a09}.map-pane{position:relative;min-width:0;min-height:0;overflow:hidden;perspective:1300px;background:#0b0d0b}.cityplate{position:absolute;inset:-4%;overflow:hidden;transform:rotateX(7deg) scale(1.035);transform-origin:50% 60%;transition:transform .45s ease;background:#0d0f0d}.cityplate__image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.72) contrast(1.12) brightness(.66) sepia(.08)}.cityplate:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(5,6,5,.08),rgba(5,6,5,.32)),radial-gradient(circle at 53% 46%,transparent 0 36%,rgba(0,0,0,.52) 90%)}#citymap{position:absolute;inset:0;width:100%;height:100%;z-index:3;overflow:visible}.cm-zone{cursor:pointer;outline:none}.cm-fill{fill:rgba(201,166,106,.025);stroke:rgba(241,234,223,.22);stroke-width:2;vector-effect:non-scaling-stroke;transition:fill .18s ease,stroke .18s ease}.cm-edge{fill:none;stroke:rgba(201,166,106,.23);stroke-width:1;vector-effect:non-scaling-stroke}.cm-zone:hover .cm-fill,.cm-zone:focus .cm-fill{fill:rgba(201,166,106,.18);stroke:rgba(201,166,106,.95);stroke-width:2.7}.cm-zone.is-on .cm-fill{fill:rgba(201,166,106,.27);stroke:#d4b472;stroke-width:3}.cm-label{fill:#f1eadf;font:600 17px var(--sans);letter-spacing:3px;text-transform:uppercase;paint-order:stroke;stroke:rgba(0,0,0,.76);stroke-width:5px;stroke-linejoin:round;pointer-events:none}.cm-dot{fill:#d4b472;stroke:#080908;stroke-width:3}.cm-pulse{fill:none;stroke:rgba(212,180,114,.52);stroke-width:2;animation:pulse 2.3s infinite}.cm-bracket,.cm-sweep,.cm-chrome{pointer-events:none}.cm-bracket{fill:none;stroke:rgba(241,234,223,.25);stroke-width:1}.cm-chrometext{fill:rgba(241,234,223,.46);font:500 10px var(--sans);letter-spacing:3px;text-transform:uppercase}.cm-sweep{stroke:rgba(201,166,106,.14);stroke-width:1;animation:sweep 7s linear infinite}.artifacts{position:absolute;inset:0;z-index:5;pointer-events:none}.artifact{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);pointer-events:auto;border:0;background:transparent;padding:0}.artifact__dot{display:block;width:16px;height:16px;border-radius:50%;border:2px solid var(--gold);background:#090a09;box-shadow:0 0 0 6px rgba(201,166,106,.12),0 7px 20px rgba(0,0,0,.5)}.artifact:hover .artifact__dot,.artifact:focus-visible .artifact__dot{background:var(--gold)}.artifact__label{position:absolute;left:22px;top:50%;transform:translateY(-50%);white-space:nowrap;padding:6px 8px;background:rgba(8,9,8,.88);border:1px solid var(--line);font-size:8px;letter-spacing:.1em;text-transform:uppercase;opacity:0;transition:.15s}.artifact:hover .artifact__label,.artifact:focus-visible .artifact__label{opacity:1}.hud{position:absolute;left:18px;top:18px;z-index:8;width:min(355px,calc(100% - 36px));background:rgba(8,9,8,.83);border:1px solid var(--line);backdrop-filter:blur(12px);padding:14px 15px}.eyebrow{display:block;color:var(--gold);font-size:8px;font-weight:600;letter-spacing:.17em;text-transform:uppercase}.hud h1{font:400 31px/1 var(--display);margin:6px 0}.hud p{margin:0;color:#a39c92;font:12px/1.5 var(--display)}.panel{min-height:0;border-left:1px solid var(--line);background:linear-gradient(180deg,#111210,#090a09);display:grid;grid-template-rows:auto 1fr}.cityread{padding:18px 16px 13px;border-bottom:1px solid var(--line);min-height:0}.cityread__eyebrow{margin:0;color:var(--gold);font-size:8px;letter-spacing:.17em;text-transform:uppercase}.cityread__name{font:400 34px/1 var(--display);margin:7px 0 8px}.cityread__note{margin:0;color:#b7afa4;font:12px/1.5 var(--display)}.cityread__right{margin-top:13px}.cityread__meta{display:grid;grid-template-columns:1fr 1fr 1fr;margin:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.cityread__meta div{padding:8px 8px 8px 0}.cityread__meta dt{font-size:7px;letter-spacing:.13em;text-transform:uppercase;color:#716d66}.cityread__meta dd{margin:3px 0 0;font-size:9px;color:#d1c9bd}.cityread__venues{display:none}.location-wrap{min-height:0;display:grid;grid-template-rows:auto 1fr}.location-head{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border-bottom:1px solid var(--line)}.location-head strong{font:400 18px var(--display)}.location-head span{font-size:7px;letter-spacing:.12em;text-transform:uppercase;color:#7e7972}.cards{min-height:0;overflow:auto;padding:10px;display:grid;gap:8px;align-content:start;scrollbar-width:thin;scrollbar-color:#4d4943 transparent}.location-card{border:1px solid rgba(241,234,223,.12);background:#0e0f0e;text-align:left;padding:12px;transition:.18s;min-height:105px}.location-card:hover,.location-card:focus-visible{border-color:rgba(201,166,106,.62);background:#151611;transform:translateX(-2px)}.location-card__cat{color:var(--gold);font-size:7px;letter-spacing:.16em;text-transform:uppercase}.location-card h3{font:400 20px var(--display);margin:5px 0 6px}.location-card p{margin:0;color:#98928a;font-size:9px;line-height:1.5}.location-card__foot{display:flex;align-items:center;justify-content:space-between;margin-top:9px;color:#c7baaa;font-size:7px;letter-spacing:.11em;text-transform:uppercase}.districts{position:absolute;z-index:8;left:18px;right:18px;bottom:18px;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}.districts::-webkit-scrollbar{display:none}.district-chip{flex:0 0 auto;border:1px solid var(--line);background:rgba(8,9,8,.86);backdrop-filter:blur(10px);padding:9px 10px;color:#9d978e;font-size:7px;letter-spacing:.12em;text-transform:uppercase}.district-chip.active{background:var(--cream);color:#111;border-color:var(--cream)}.quick{position:absolute;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:flex-end;background:rgba(0,0,0,.35);padding:18px}.quick.is-open{display:flex}.quick__panel{width:min(390px,100%);background:#0c0d0c;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.55);padding:18px}.quick__top{display:flex;justify-content:space-between;gap:12px}.quick__close{border:0;background:transparent;font-size:20px;min-width:44px;min-height:44px}.quick h2{font:400 29px/1.05 var(--display);margin:7px 0 9px}.quick p{font:13px/1.5 var(--display);color:#bdb4a8;margin:0}.quick__actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:15px}.quick__actions a{min-height:44px;display:grid;place-items:center;text-align:center;border:1px solid var(--line);font-size:7px;letter-spacing:.12em;text-transform:uppercase}.quick__actions a:first-child{background:var(--cream);color:#111}@keyframes pulse{0%{r:7;opacity:.9}100%{r:27;opacity:0}}@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(2000px)}}
@media(max-width:840px){html,body{overscroll-behavior:none}.app{grid-template-columns:1fr;grid-template-rows:minmax(0,56%) minmax(0,44%)}.map-pane{min-height:0}.cityplate{inset:-8%;transform:rotateX(9deg) scale(1.07)}.panel{border-left:0;border-top:1px solid var(--line);grid-template-rows:auto 1fr}.cityread{padding:9px 11px 8px}.cityread__name{font-size:25px;margin:4px 0}.cityread__note{display:none}.cityread__right{margin-top:7px}.cityread__meta div{padding:6px 5px 6px 0}.location-head{padding:7px 10px}.cards{grid-auto-flow:column;grid-auto-columns:min(80vw,320px);grid-template-rows:1fr;overflow-x:auto;overflow-y:hidden;padding:8px 10px;scroll-snap-type:x proximity}.location-card{scroll-snap-align:start;height:100%;min-height:0}.hud{left:10px;top:10px;padding:9px 11px;width:min(300px,calc(100% - 20px))}.hud h1{font-size:22px}.hud p{font-size:10px}.districts{left:10px;right:10px;bottom:10px}.district-chip{min-height:40px;padding:9px 10px}.artifact__dot{width:20px;height:20px}.artifact__label{display:none}.cm-label{font-size:16px}.quick{padding:0;align-items:flex-end}.quick__panel{width:100%;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-left:0;border-right:0;border-bottom:0}.quick__actions a{min-height:48px}}
@media(max-width:520px){.app{grid-template-rows:54% 46%}.hud p{display:none}.cityread__meta{grid-template-columns:1fr 1fr 1fr}.location-card h3{font-size:18px}.districts{bottom:8px}.district-chip{font-size:6px}.cm-chrometext{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}.cityplate{transform:none}}
</style>
</head>
<body>
<main class="app">
  <section class="map-pane" aria-label="Interactive Charlotte neighborhood map">
    <div class="cityplate">
      <picture><source media="(max-width:760px)" srcset="assets/img/citymap-plate@sm.jpg"><img class="cityplate__image" src="assets/img/citymap-plate.jpg" alt="Aerial view of Charlotte and surrounding neighborhoods"></picture>
      <svg id="citymap" aria-label="Charlotte neighborhood districts"></svg>
      <div class="artifacts" aria-label="Selected neighborhood locations"></div>
    </div>
    <div class="hud"><span class="eyebrow">Charlotte · Mecklenburg</span><h1>Hover the city.</h1><p>Hover for neighborhood character. Click or tap to lock a district and surface its places.</p></div>
    <nav class="districts" id="districts" aria-label="Charlotte districts"></nav>
  </section>
  <aside class="panel">
    <div id="cityread" class="cityread" aria-live="polite"></div>
    <section class="location-wrap">
      <div class="location-head"><strong>Locations</strong><span id="location-count">Selected district</span></div>
      <div class="cards" id="location-cards"></div>
    </section>
  </aside>
</main>
<aside class="quick" id="cityquick" aria-hidden="true">
  <div class="quick__panel">
    <div class="quick__top"><div><span class="eyebrow" id="cityquick-cat"></span><h2 id="cityquick-name"></h2></div><button class="quick__close" type="button" data-cityquick-close aria-label="Close location details">×</button></div>
    <p id="cityquick-note"></p>
    <div class="quick__actions"><a id="cityquick-link" href="charlotte.html">Full Details</a><a id="cityquick-all" href="charlotte.html"><span>Browse Nearby</span></a></div>
  </div>
</aside>
<script src="assets/js/city.js?v=17"></script>
<script src="assets/js/city-explorer.js?v=17"></script>
<script>
(function(){
'use strict';
var C=window.CHARLOTTE;if(!C||!C.districts)return;
var nav=document.getElementById('districts'),cards=document.getElementById('location-cards'),count=document.getElementById('location-count');
function esc(s){return String(s==null?'':s).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]})}
function activeZone(id){Array.prototype.forEach.call(document.querySelectorAll('.cm-zone'),function(z){z.classList.toggle('is-on',z.dataset.id===id)});Array.prototype.forEach.call(nav.querySelectorAll('.district-chip'),function(b){b.classList.toggle('active',b.dataset.id===id)})}
function renderCards(d){activeZone(d.id);count.textContent=(d.venues||[]).length+' pinned';cards.innerHTML=(d.venues||[]).map(function(v,i){return '<button type="button" class="location-card" data-i="'+i+'"><span class="location-card__cat">'+esc(v.cat)+'</span><h3>'+esc(v.name)+'</h3><p>'+esc(v.note)+'</p><span class="location-card__foot"><span>Charlotte · '+String(i+1).padStart(2,'0')+'</span><span>Open →</span></span></button>'}).join('');cards.querySelectorAll('.location-card').forEach(function(btn){btn.addEventListener('click',function(){var list=document.querySelectorAll('.cityread__venue');if(list[+btn.dataset.i])list[+btn.dataset.i].click()})})}
C.districts.forEach(function(d){var b=document.createElement('button');b.type='button';b.className='district-chip';b.dataset.id=d.id;b.textContent=d.name;b.addEventListener('click',function(){var zone=document.querySelector('.cm-zone[data-id="'+d.id+'"]');if(zone)zone.dispatchEvent(new MouseEvent('click',{bubbles:true}))});nav.appendChild(b)});
document.addEventListener('citymap:district',function(e){if(e.detail)renderCards(e.detail)});
// city.js selects Uptown before this listener is attached. Repaint it once so
// the custom card rail and chips begin in the same state as the map.
var hash=location.hash.replace(/^#/,'');var start=C.districts.filter(function(d){return d.id===hash||d.group===hash})[0]||C.districts[0];
setTimeout(function(){var zone=document.querySelector('.cm-zone[data-id="'+start.id+'"]');if(zone)zone.dispatchEvent(new MouseEvent('click',{bubbles:true}));else renderCards(start)},0);
// On touch there is no hover state, so focus/tap is deliberately the same
// action: city.js paints the district readout and our event renders cards.
document.querySelectorAll('.cm-zone').forEach(function(z){z.addEventListener('pointerdown',function(){var d=C.districts.filter(function(x){return x.id===z.dataset.id})[0];if(d)renderCards(d)},{passive:true})});
})();
</script>
</body>
</html>
